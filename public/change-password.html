<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitClub - Changer le mot de passe</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="navbar">
        <div class="container nav-container">
            <a href="/" class="logo"><img src="/assets/logo/FITCLUB.png" alt="FitClub Logo" class="brand-logo"></a>
            <nav>
                <ul class="nav-links">
                    <li><a href="/">Accueil</a></li>
                    <li><a href="/activities.html">Activités</a></li>
                    <li><a href="/planning.html">Planning</a></li>
                </ul>
            </nav>
            <div class="auth-section">
                <a href="#" id="btn-logout" class="btn-login" style="display:none;">Déconnexion</a>
            </div>
        </div>
    </header>

    <main class="auth-page">
        <section class="auth-container">
            <h2>Changer le mot de passe</h2>
            <form id="change-password-form" class="auth-form">
                <div class="form-group">
                    <label for="currentPassword">Mot de passe actuel</label>
                    <input type="password" id="currentPassword" name="currentPassword" required autocomplete="current-password">
                </div>
                <div class="form-group">
                    <label for="newPassword">Nouveau mot de passe (min. 8 caractères)</label>
                    <input type="password" id="newPassword" name="newPassword" minlength="8" required autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirmer le nouveau mot de passe</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" minlength="8" required autocomplete="new-password">
                </div>
                <div class="auth-actions">
                    <button type="submit" class="btn-primary">Enregistrer</button>
                    <a href="/" class="btn-secondary" style="margin-left: 10px; padding: 10px; border-radius: 4px; text-decoration: none; border: 1px solid #ccc; color: #333;">Annuler</a>
                </div>
                <div id="auth-error" class="error-message"></div>
                <div id="auth-success" class="success-message" style="display: none; padding: 10px; background-color: #e8f5e9; color: #2e7d32; border-radius: 4px; margin-top: 15px;"></div>
            </form>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 FitClub. Tous droits réservés.</p>
        </div>
    </footer>

    <!-- JS module for authentication logic -->
    <script type="module">
        import { changePassword, updateNavbar } from './js/auth.js';
        
        document.addEventListener('DOMContentLoaded', () => {
            updateNavbar();
            const token = sessionStorage.getItem('token');
            if (!token) {
                window.location.href = '/login.html?redirect=/change-password.html';
                return;
            }

            const logoutBtn = document.getElementById('btn-logout');
            if (logoutBtn) {
                logoutBtn.style.display = 'inline-block';
                logoutBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    sessionStorage.removeItem('token');
                    sessionStorage.removeItem('user');
                    window.location.href = '/login.html';
                });
            }

            const form = document.getElementById('change-password-form');
            const errorContainer = document.getElementById('auth-error');
            const successContainer = document.getElementById('auth-success');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const currentPassword = document.getElementById('currentPassword').value;
                const newPassword = document.getElementById('newPassword').value;
                const confirmPassword = document.getElementById('confirmPassword').value;

                // Reset states
                errorContainer.style.display = 'none';
                errorContainer.textContent = '';
                successContainer.style.display = 'none';
                successContainer.textContent = '';

                if (newPassword !== confirmPassword) {
                    errorContainer.textContent = 'Les nouveaux mots de passe ne correspondent pas.';
                    errorContainer.style.display = 'block';
                    return;
                }

                try {
                    const response = await changePassword(currentPassword, newPassword, confirmPassword);
                    
                    if (response && response.message) {
                        successContainer.textContent = response.message || 'Mot de passe modifié avec succès.';
                        successContainer.style.display = 'block';
                        form.reset();
                    } else {
                        throw new Error('Erreur lors du changement de mot de passe.');
                    }
                } catch (error) {
                    console.error('Erreur:', error);
                    errorContainer.textContent = error.error || error.message || 'Une erreur est survenue.';
                    errorContainer.style.display = 'block';
                }
            });
        });
    </script>
</body>
</html>
