<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitClub - Nos Activités</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="navbar">
        <div class="container nav-container">
            <a href="/" class="logo"><img src="/assets/logo/FITCLUB.png" alt="FitClub Logo" class="brand-logo"></a>
            <nav>
                <ul class="nav-links">
                    <li><a href="/">Accueil</a></li>
                    <li><a href="/activities.html" class="active">Activités</a></li>
                    <li><a href="/planning.html">Planning</a></li>
                </ul>
            </nav>
            <div class="auth-section">
                <a href="/admin/activities.html" class="admin-btn" title="Espace Administrateur"><img src="/assets/icons/shield-user.png" alt="Admin" style="height: 24px; vertical-align: middle;"></a>
                <a href="/login.html" class="btn-login">Connexion</a>
            </div>
        </div>
    </header>

    <main class="container page-content">
        <div class="page-header">
            <h2>Nos Activités</h2>
            <p>Découvrez toutes nos activités et trouvez celles qui correspondent à vos objectifs.</p>
        </div>

        <section class="filters-section">
            <form id="filters-form" class="filters-form">
                <div class="filter-group">
                    <label for="search-title">Recherche</label>
                    <input type="text" id="search-title" name="search-title" placeholder="Ex: Yoga, Crossfit...">
                </div>
                <div class="filter-group">
                    <label for="filter-type">Type</label>
                    <select id="filter-type" name="filter-type">
                        <option value="">Tous les types</option>
                        <option value="Cardio">Cardio</option>
                        <option value="Renforcement">Renforcement</option>
                        <option value="Détente">Détente</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="filter-objective">Objectif</label>
                    <select id="filter-objective" name="filter-objective">
                        <option value="">Tous les objectifs</option>
                        <option value="Perte de poids">Perte de poids</option>
                        <option value="Prise de masse">Prise de masse</option>
                        <option value="Souplesse">Souplesse</option>
                    </select>
                </div>
            </form>
        </section>

        <section class="activities-grid" id="activities-grid">
            <!-- Activités générées dynamiquement par JS -->
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 FitClub. Tous droits réservés.</p>
        </div>
    </footer>

    <!-- Script placeholder for business logic -->
    <script type="module" src="/js/activities.js"></script>
    <script type="module">
        import { updateNavbar } from '/js/auth.js';
        updateNavbar();
    </script>
</body>
</html>
