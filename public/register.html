<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitClub - Inscription</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="navbar">
        <div class="container nav-container">
            <a href="/" class="logo"><img src="/assets/logo/FITCLUB.png" alt="FitClub Logo" class="brand-logo"></a>
            <nav>
                <ul class="nav-links">
                    <li><a href="/">Accueil</a></li>
                    <li><a href="/activities.html">Activités</a></li>
                    <li><a href="/planning.html">Planning</a></li>
                </ul>
            </nav>
            <div class="auth-section">
                <a href="/login.html" class="btn-login">Connexion</a>
            </div>
        </div>
    </header>

    <main class="auth-page">
        <section class="auth-container">
            <h2>Créer un compte</h2>
            <form id="register-form" class="auth-form">
                <div class="form-group">
                    <label for="email">Adresse Email</label>
                    <input type="email" id="email" name="email" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="password">Mot de passe (min. 8 caractères)</label>
                    <input type="password" id="password" name="password" minlength="8" required autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirmer le mot de passe</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" minlength="8" required autocomplete="new-password">
                </div>
                <div class="auth-actions">
                    <button type="submit" class="btn-primary">S'inscrire</button>
                </div>
                <p class="auth-redirect">
                    Déjà un compte ? <a href="/login.html">Connectez-vous ici</a>.
                </p>
                <div id="auth-error" class="error-message"></div>
            </form>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 FitClub. Tous droits réservés.</p>
        </div>
    </footer>

    <!-- JS module for authentication logic -->
    <script type="module">
        import { registerUser, updateNavbar } from './js/auth.js';
        
        document.addEventListener('DOMContentLoaded', () => {
            updateNavbar();
            const form = document.getElementById('register-form');
            const errorContainer = document.getElementById('auth-error');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirmPassword').value;

                // Reset error state
                errorContainer.style.display = 'none';
                errorContainer.textContent = '';

                if (password !== confirmPassword) {
                    errorContainer.textContent = 'Les mots de passe ne correspondent pas.';
                    errorContainer.style.display = 'block';
                    return;
                }

                try {
                    const response = await registerUser(email, password, confirmPassword);
                    
                    if (response && response.success) {
                        console.log("Inscription réussie :", response.message);
                        // Redirection vers la page de connexion
                        window.location.href = '/login.html';
                    } else {
                        // Affichage du message d'erreur renvoyé par l'API
                        errorContainer.textContent = response.message || "Erreur lors de l'inscription.";
                        errorContainer.style.display = 'block';
                    }
                } catch (error) {
                    console.error("Erreur d'inscription:", error);
                    errorContainer.textContent = error.message || "Une erreur est survenue lors de l'inscription.";
                    errorContainer.style.display = 'block';
                }
            });
        });
    </script>
</body>
</html>
